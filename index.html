<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>Wanderer's Budget</title>
<!--
  WANDERER'S BUDGET — single-file offline travel companion
  Explore. Track. Remember.
  Everything (HTML/CSS/JS) lives in this one file so it can be saved to an
  Android phone and opened directly in a browser with zero network access.
  Persistence: localStorage only. No external requests, fonts, or scripts.
-->
<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root{
  --primary:#2563EB;
  --primary-dark:#1d4ed8;
  --primary-light:#dbeafe;
  --secondary:#14B8A6;
  --secondary-light:#ccfbf1;
  --accent:#F59E0B;
  --accent-light:#fef3c7;
  --bg:#F8FAFC;
  --card:#FFFFFF;
  --text:#0F172A;
  --subtext:#64748B;
  --border:#E2E8F0;
  --danger:#EF4444;
  --radius-sm:10px;
  --radius:16px;
  --radius-lg:24px;
  --shadow-sm:0 1px 3px rgba(15,23,42,.06);
  --shadow:0 8px 24px rgba(15,23,42,.08);
  --shadow-lg:0 16px 40px rgba(15,23,42,.14);
  --nav-h:64px;
}
html.dark{
  --bg:#0B1220;
  --card:#141C2E;
  --text:#F1F5F9;
  --subtext:#94A3B8;
  --border:#1E293B;
  --primary-light:#16233f;
  --secondary-light:#0f2e2a;
  --accent-light:#3a2c0f;
}
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-tap-highlight-color:transparent;
  transition:background .25s ease,color .25s ease;
}
h1,h2,h3,h4{margin:0;letter-spacing:-0.02em;}
p{margin:0;}
button{font-family:inherit;}
a{color:inherit;text-decoration:none;}
::selection{background:var(--primary-light);}

/* Layout shell */
#app{
  max-width:560px;
  margin:0 auto;
  min-height:100vh;
  padding-bottom:calc(var(--nav-h) + 24px);
  position:relative;
}
.screen{animation:fadeSlide .28s ease both;}
@keyframes fadeSlide{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@media (prefers-reduced-motion:reduce){.screen{animation:none;}*{transition:none !important;animation:none !important;}}

/* Top bar */
.topbar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:12px;
  padding:16px 20px;
  background:color-mix(in srgb, var(--bg) 85%, transparent);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}
.topbar .back-btn{
  width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--card);box-shadow:var(--shadow-sm);
  border:1px solid var(--border);
  font-size:18px;cursor:pointer;flex-shrink:0;
}
.topbar .back-btn:active{transform:scale(.92);}
.topbar h2{font-size:18px;flex:1;}
.topbar .icon-btn{
  width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--card);box-shadow:var(--shadow-sm);
  border:1px solid var(--border);
  cursor:pointer;font-size:16px;
}

.page-pad{padding:4px 20px 20px;}

/* Cards */
.card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow-sm);
  border:1px solid var(--border);
  padding:18px;
}
.card-tap{cursor:pointer;transition:transform .15s ease,box-shadow .15s ease;}
.card-tap:active{transform:scale(.98);box-shadow:var(--shadow-sm);}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 20px;border-radius:14px;border:none;
  font-weight:600;font-size:15px;cursor:pointer;
  transition:transform .12s ease,opacity .12s ease;
  width:100%;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 6px 16px rgba(37,99,235,.3);}
.btn-secondary{background:var(--secondary-light);color:var(--secondary);}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--text);}
.btn-ghost{background:transparent;color:var(--subtext);}
.btn-danger{background:#fee2e2;color:var(--danger);}
.btn-sm{padding:9px 14px;font-size:13px;width:auto;border-radius:10px;}

/* Forms */
.field{margin-bottom:16px;}
.field label{display:block;font-size:13px;font-weight:600;color:var(--subtext);margin-bottom:7px;}
.field input[type=text],
.field input[type=number],
.field input[type=time],
.field select,
.field textarea{
  width:100%;padding:13px 14px;border-radius:12px;
  border:1.5px solid var(--border);background:var(--bg);
  color:var(--text);font-size:15px;font-family:inherit;
  transition:border-color .15s ease;
}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:none;border-color:var(--primary);
}
.field textarea{resize:vertical;min-height:70px;}
.field input[type=time]{color-scheme:light;}
html.dark .field input[type=time]{color-scheme:dark;}
.field .file-drop{
  border:1.5px dashed var(--border);border-radius:12px;
  padding:20px;text-align:center;color:var(--subtext);font-size:13px;
  cursor:pointer;background:var(--bg);
}
.field .file-drop input{display:none;}
.file-preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.file-preview img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--border);}

.pill-group{display:flex;gap:8px;flex-wrap:wrap;}
.pill{
  padding:10px 16px;border-radius:12px;border:1.5px solid var(--border);
  background:var(--bg);font-size:13.5px;font-weight:600;cursor:pointer;color:var(--subtext);
}
.pill.active{background:var(--primary);border-color:var(--primary);color:#fff;}

.split-row{display:flex;gap:10px;}
.split-row .field{flex:1;}

/* Rating stars */
.stars{display:flex;gap:6px;font-size:22px;cursor:pointer;}
.stars span{opacity:.25;}
.stars span.on{opacity:1;}

/* Hero (home) */
.hero{
  padding:36px 20px 28px;
  background:linear-gradient(160deg,var(--primary) 0%,#3b82f6 55%,var(--secondary) 130%);
  border-radius:0 0 32px 32px;
  color:#fff;position:relative;overflow:hidden;
}
.hero::after{
  content:'';position:absolute;right:-40px;top:-40px;width:180px;height:180px;
  background:rgba(255,255,255,.12);border-radius:50%;
}
.hero .logo-row{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
.hero .logo-mark{
  width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.22);
  display:flex;align-items:center;justify-content:center;font-size:18px;
}
.hero .brand{font-size:15px;font-weight:700;letter-spacing:.02em;}
.hero h1{font-size:30px;font-weight:800;line-height:1.15;margin-bottom:8px;position:relative;}
.hero p.tagline{font-size:14.5px;opacity:.92;font-style:italic;position:relative;}
.hero-stat-row{display:flex;gap:10px;margin-top:22px;position:relative;}
.hero-stat{
  flex:1;background:rgba(255,255,255,.14);backdrop-filter:blur(6px);
  border-radius:14px;padding:12px 14px;
}
.hero-stat .num{font-size:19px;font-weight:800;}
.hero-stat .lbl{font-size:11px;opacity:.85;margin-top:2px;}

.section-title{
  font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  color:var(--subtext);margin:26px 0 12px;
}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.action-card{
  background:var(--card);border-radius:var(--radius);padding:18px;
  border:1px solid var(--border);box-shadow:var(--shadow-sm);
  display:flex;flex-direction:column;gap:8px;cursor:pointer;
}
.action-card .ic{font-size:24px;}
.action-card .lbl{font-weight:700;font-size:14.5px;}
.action-card .sub{font-size:12px;color:var(--subtext);}

/* Trip / destination card */
.trip-card{
  border-radius:var(--radius-lg);
  padding:20px;margin-bottom:14px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#1e293b,#334155);
  color:#fff;box-shadow:var(--shadow);
}
.trip-card .badge{
  position:absolute;top:16px;right:16px;font-size:11px;font-weight:700;
  padding:5px 10px;border-radius:20px;background:rgba(255,255,255,.18);
  text-transform:uppercase;letter-spacing:.04em;
}
.trip-card h3{font-size:20px;margin-bottom:14px;padding-right:70px;}
.trip-card .metrics{display:flex;gap:18px;}
.trip-card .metrics .m .num{font-size:17px;font-weight:800;}
.trip-card .metrics .m .lbl{font-size:11px;opacity:.75;}

.search-bar{
  display:flex;align-items:center;gap:8px;
  background:var(--card);border:1.5px solid var(--border);border-radius:14px;
  padding:11px 14px;margin-bottom:16px;
}
.search-bar input{border:none;background:transparent;flex:1;font-size:14.5px;color:var(--text);outline:none;font-family:inherit;}

/* Empty state */
.empty-state{
  text-align:center;padding:50px 20px;color:var(--subtext);
}
.empty-state .ic{font-size:44px;margin-bottom:14px;}
.empty-state h3{font-size:16px;color:var(--text);margin-bottom:6px;}
.empty-state p{font-size:13.5px;margin-bottom:18px;}

/* Boarding-pass style dashboard header — signature element */
.boarding-pass{
  position:relative;
  background:linear-gradient(135deg,var(--primary),#1d4ed8);
  border-radius:var(--radius-lg);
  color:#fff;padding:22px 22px 18px;
  box-shadow:var(--shadow-lg);
  margin-bottom:4px;
}
.boarding-pass .row1{display:flex;justify-content:space-between;align-items:flex-start;}
.boarding-pass .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.75;}
.boarding-pass h2{font-size:22px;margin-top:4px;}
.boarding-pass .total{text-align:right;}
.boarding-pass .total .amt{font-size:24px;font-weight:800;}
.boarding-pass .total .lbl{font-size:10.5px;opacity:.75;}
.perforation{
  display:flex;align-items:center;margin:16px -22px 0;
}
.perforation .hole{width:16px;height:16px;background:var(--bg);border-radius:50%;flex-shrink:0;}
.perforation .hole.left{margin-left:-8px;}
.perforation .hole.right{margin-right:-8px;}
.perforation .dashes{flex:1;border-top:2px dashed rgba(255,255,255,.35);}
.boarding-pass .split-stats{display:flex;padding-top:16px;gap:8px;}
.boarding-pass .split-stats .s{flex:1;background:rgba(255,255,255,.13);border-radius:12px;padding:10px 12px;}
.boarding-pass .split-stats .s .n{font-size:15px;font-weight:800;}
.boarding-pass .split-stats .s .l{font-size:10px;opacity:.8;}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow-sm);}
.stat-card .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.stat-card .top .ic{font-size:18px;}
.stat-card .top .pct{font-size:11px;font-weight:700;color:var(--secondary);}
.stat-card .amt{font-size:16px;font-weight:800;}
.stat-card .name{font-size:12px;color:var(--subtext);}
.stat-card .bar{height:4px;background:var(--border);border-radius:2px;margin-top:8px;overflow:hidden;}
.stat-card .bar span{display:block;height:100%;background:var(--primary);border-radius:2px;}

.day-card{
  display:flex;justify-content:space-between;align-items:center;
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px 18px;margin-bottom:10px;cursor:pointer;box-shadow:var(--shadow-sm);
}
.day-card .day-num{font-size:15px;font-weight:700;}
.day-card .day-sub{font-size:12px;color:var(--subtext);margin-top:2px;}
.day-card .day-amt{font-size:16px;font-weight:800;color:var(--primary);}

.expense-row{
  display:flex;align-items:center;gap:12px;
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:13px 15px;margin-bottom:9px;
}
.expense-row .ic{
  width:40px;height:40px;border-radius:11px;background:var(--primary-light);color:var(--primary);
  display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;
}
.expense-row .info{flex:1;min-width:0;}
.expense-row .title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.expense-row .sub{font-size:11.5px;color:var(--subtext);margin-top:2px;}
.expense-row .amt{font-size:14.5px;font-weight:800;}

.category-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px;}
.category-tile{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;text-align:center;cursor:pointer;box-shadow:var(--shadow-sm);
}
.category-tile .ic{font-size:26px;margin-bottom:6px;}
.category-tile .lbl{font-size:13px;font-weight:700;}

/* Gallery */
.masonry{column-count:2;column-gap:10px;}
.masonry .item{
  break-inside:avoid;margin-bottom:10px;border-radius:14px;overflow:hidden;
  box-shadow:var(--shadow-sm);position:relative;background:var(--card);
}
.masonry .item img{width:100%;display:block;}
.masonry .item .tag{
  position:absolute;bottom:8px;left:8px;font-size:10px;font-weight:700;
  background:rgba(15,23,42,.65);color:#fff;padding:4px 8px;border-radius:8px;
  text-transform:capitalize;
}

/* Bottom nav */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  max-width:560px;margin:0 auto;
  height:var(--nav-h);
  background:color-mix(in srgb, var(--card) 92%, transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--border);
  display:flex;
}
.bottom-nav .nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--subtext);font-size:10.5px;font-weight:600;cursor:pointer;
}
.bottom-nav .nav-item .ic{font-size:19px;}
.bottom-nav .nav-item.active{color:var(--primary);}

/* FAB */
.fab{
  position:fixed;right:calc(50% - 260px);bottom:calc(var(--nav-h) + 18px);
  width:56px;height:56px;border-radius:50%;
  background:var(--accent);color:#fff;font-size:26px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 20px rgba(245,158,11,.4);
  border:none;cursor:pointer;z-index:25;
}
@media (max-width:600px){.fab{right:20px;}}
.fab:active{transform:scale(.92);}

/* Toast */
#toast-host{position:fixed;top:14px;left:0;right:0;display:flex;justify-content:center;z-index:100;pointer-events:none;}
.toast{
  background:var(--text);color:var(--bg);padding:11px 18px;border-radius:30px;
  font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lg);
  animation:toastIn .25s ease both;
}
@keyframes toastIn{from{opacity:0;transform:translateY(-12px);}to{opacity:1;transform:translateY(0);}}

/* Modal */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:50;
  display:flex;align-items:flex-end;justify-content:center;
  animation:fadeSlide .2s ease both;
}
.modal-sheet{
  background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;
  padding:22px 20px calc(22px + env(safe-area-inset-bottom));
  max-height:80vh;overflow-y:auto;
}
.modal-sheet h3{font-size:17px;margin-bottom:16px;}

/* Calendar picker */
.cal-picker .cal-header{display:flex;align-items:center;justify-content:center;margin-bottom:14px;}
.cal-picker .cal-header h3{margin:0;font-size:16px;}
.cal-hint{text-align:center;font-size:11px;color:var(--subtext);margin-bottom:10px;opacity:.7;}
.cal-swipe{touch-action:pan-y;animation:calIn .18s ease both;user-select:none;-webkit-user-select:none;cursor:grab;}
.cal-swipe.swipe-left{animation:calSlideLeft .18s ease both;}
.cal-swipe.swipe-right{animation:calSlideRight .18s ease both;}
@keyframes calIn{from{opacity:0;}to{opacity:1;}}
@keyframes calSlideLeft{from{opacity:1;transform:translateX(0);}to{opacity:0;transform:translateX(-24px);}}
@keyframes calSlideRight{from{opacity:1;transform:translateX(0);}to{opacity:0;transform:translateX(24px);}}
.cal-picker .cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11.5px;font-weight:700;color:var(--subtext);margin-bottom:6px;}
.cal-picker .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-cell{
  aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;
  border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;color:var(--text);
}
.cal-cell:not(.empty):active{transform:scale(.92);}
.cal-cell.empty{cursor:default;}
.cal-cell.today{border:1.5px solid var(--primary);}
.cal-cell.sel{background:var(--primary);color:#fff;}
.date-display{
  display:flex;align-items:center;gap:8px;
  width:100%;padding:13px 14px;border-radius:12px;
  border:1.5px solid var(--border);background:var(--bg);
  color:var(--text);font-size:15px;cursor:pointer;
}
.date-display .ph{color:var(--subtext);}

/* Skeleton */
.skeleton{background:linear-gradient(90deg,var(--border) 25%,var(--bg) 37%,var(--border) 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite;border-radius:var(--radius);}
@keyframes shimmer{0%{background-position:100% 50%;}100%{background-position:0 50%;}}

/* Chart canvases */
canvas{max-width:100%;}

/* Progress ring legend */
.legend-row{display:flex;align-items:center;gap:8px;font-size:12.5px;margin-bottom:7px;}
.legend-row .dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
.legend-row .amt{margin-left:auto;font-weight:700;}

/* Utility */
.flex-between{display:flex;justify-content:space-between;align-items:center;}
.mt-8{margin-top:8px;}
.mt-16{margin-top:16px;}
.mb-16{margin-bottom:16px;}
.text-sub{color:var(--subtext);font-size:13px;}
.total-row{
  display:flex;justify-content:space-between;padding-top:12px;margin-top:12px;
  border-top:1.5px dashed var(--border);font-weight:800;font-size:15px;
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast-host"></div>

<script>
/* ==================================================================
   STORAGE LAYER  (js/storage.js equivalent)
   ================================================================== */
const Storage = {
  KEY: 'wb_trips',
  THEME_KEY: 'wb_theme',
  getTrips(){
    try{ return JSON.parse(localStorage.getItem(this.KEY)) || []; }
    catch(e){ return []; }
  },
  saveTrips(trips){
    localStorage.setItem(this.KEY, JSON.stringify(trips));
  },
  getTrip(id){
    return this.getTrips().find(t => t.id === id);
  },
  upsertTrip(trip){
    const trips = this.getTrips();
    const idx = trips.findIndex(t => t.id === trip.id);
    if(idx >= 0) trips[idx] = trip; else trips.push(trip);
    this.saveTrips(trips);
  },
  deleteTrip(id){
    this.saveTrips(this.getTrips().filter(t => t.id !== id));
  },
  getTheme(){ return localStorage.getItem(this.THEME_KEY) || 'light'; },
  setTheme(v){ localStorage.setItem(this.THEME_KEY, v); }
};

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function fmtMoney(n){ return '₹' + Math.round(n||0).toLocaleString('en-IN'); }
function fmtDate(ts){ return new Date(ts).toLocaleDateString('en-IN',{day:'numeric',month:'short'}); }

/* ==================================================================
   EXPENSE CATEGORY CONFIG (js/expense.js equivalent)
   Each category drives a data-built form + icon + display fields.
   ================================================================== */
const CATEGORIES = {
  travel:      { label:'Travel',          icon:'✈️',
    fields:[
      {id:'startDate',label:'Travel Start Date',type:'date',required:true},
      {id:'endDate',label:'Travel End Date',type:'date'},
      {id:'transportType',label:'Transport Type',type:'select',options:['Bus','Train','Flight','Bike','Car','Auto','Other']},
      {id:'transportName',label:'Transport Name',type:'text'},
    ], photo:{label:'Ticket Upload',multi:false},
    title:e => e.startDate ? (formatDateDisplay(e.startDate) + (e.endDate ? ' → '+formatDateDisplay(e.endDate) : '')) : (e.transportName||'Travel'),
    sub:e => e.transportType||'' },
  food:        { label:'Food',            icon:'🍽️',
    fields:[
      {id:'restaurantName',label:'Restaurant Name',type:'text',required:true},
      {id:'mealType',label:'Meal Type',type:'select',options:['Breakfast','Lunch','Dinner','Snacks']},
      {id:'snackType',label:'Snack Options',type:'select',options:['Tea','Juice','Coffee','Water','Biscuits','Chips','Ice Cream','Other']},
      {id:'rating',label:'Rating',type:'rating'},
    ], photo:{label:'Food Photo',multi:false},
    title:e => e.restaurantName||'Food', sub:e => e.mealType||'' },
  stay:        { label:'Stay',            icon:'🏨',
    fields:[
      {id:'hotelName',label:'Hotel Name',type:'text',required:true},
      {id:'location',label:'Location',type:'text'},
    ], photo:{label:'Room Photos',multi:true},
    title:e => e.hotelName||'Stay', sub:e => e.location||'' },
  adventure:   { label:'Adventure',       icon:'🏔️',
    fields:[
      {id:'activityName',label:'Activity Name',type:'text',required:true},
      {id:'duration',label:'Duration',type:'text'},
    ], photo:{label:'Photos',multi:true},

};
const CATEGORY_KEYS = Object.keys(CATEGORIES);

/* ==================================================================
   TRIP HELPERS  (js/trip.js equivalent)
   ================================================================== */
function newTrip(name){
  return { id:uid(), name, status:'current', createdAt:Date.now(),
           days:[{id:uid(), dayNumber:1, expenses:[]}] };
}
function allExpenses(trip){
  return trip.days.flatMap(d => d.expenses.map(e => ({...e, dayId:d.id, dayNumber:d.dayNumber})));
}
function tripTotal(trip){ return allExpenses(trip).reduce((s,e)=>s+Number(e.amount||0),0); }
function tripCashTotal(trip){
  return allExpenses(trip).reduce((s,e)=>{
    if(e.payment==='cash') return s+Number(e.amount||0);
    if(e.payment==='split') return s+Number(e.cashAmount||0);
    return s;
  },0);
}
function tripUpiTotal(trip){
  return allExpenses(trip).reduce((s,e)=>{
    if(e.payment==='upi') return s+Number(e.amount||0);
    if(e.payment==='split') return s+Number(e.upiAmount||0);
    return s;
  },0);
}
function categoryTotals(trip){
  const totals = {};
  CATEGORY_KEYS.forEach(k => totals[k]=0);
  allExpenses(trip).forEach(e => { totals[e.category] = (totals[e.category]||0) + Number(e.amount||0); });
  return totals;
}
function dayTotal(day){ return day.expenses.reduce((s,e)=>s+Number(e.amount||0),0); }

/* ==================================================================
   ROUTER
   ================================================================== */
let CURRENT_PARAMS = {};
function navigate(hash){ location.hash = hash; }
function parseHash(){
  const h = location.hash.slice(1) || '/home';
  const parts = h.split('/').filter(Boolean);
  return parts;
}
window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', () => {
  if(Storage.getTheme()==='dark') document.documentElement.classList.add('dark');
  render();
});

function showToast(msg){
  const host = document.getElementById('toast-host');
  const t = document.createElement('div');
  t.className='toast'; t.textContent = msg;
  host.appendChild(t);
  setTimeout(()=> t.remove(), 2200);
}

/* ==================================================================
   MAIN RENDER DISPATCH
   ================================================================== */
function render(){
  const parts = parseHash();
  const app = document.getElementById('app');
  let html = '';

  if(parts[0]==='home' || parts.length===0){ html = viewHome(); }
  else if(parts[0]==='create-trip'){ html = viewCreateTrip(); }
  else if(parts[0]==='trips' && parts[1]==='current'){ html = viewTripList('current'); }
  else if(parts[0]==='trips' && parts[1]==='previous'){ html = viewTripList('previous'); }
  else if(parts[0]==='trip' && parts[2]==='dashboard'){ html = viewDashboard(parts[1]); }
  else if(parts[0]==='trip' && parts[2]==='day' && parts[4]===undefined){ html = viewDayDetails(parts[1], parts[3]); }
  else if(parts[0]==='trip' && parts[2]==='expense'){ html = viewExpenseForm(parts[1], parts[3], parts[4], parts[5]); }
  else if(parts[0]==='trip' && parts[2]==='analytics'){ html = viewAnalytics(parts[1]); }
  else if(parts[0]==='trip' && parts[2]==='gallery'){ html = viewGallery(parts[1]); }
  else if(parts[0]==='trip' && parts[2]==='summary'){ html = viewSummary(parts[1]); }
  else { html = viewHome(); }

  app.innerHTML = `<div class="screen">${html}</div>` + bottomNav(parts);
  afterRender(parts);
}

function bottomNav(parts){
  const on = (name) => (navSection(parts)===name ? 'active' : '');
  return `
  <div class="bottom-nav">
    <div class="nav-item ${on('home')}" onclick="navigate('/home')"><span class="ic">🏠</span>Home</div>
    <div class="nav-item ${on('trips')}" onclick="navigate('/trips/current')"><span class="ic">🧳</span>Trips</div>
    <div class="nav-item ${on('analytics')}" onclick="goCurrentTripSection('analytics')"><span class="ic">📊</span>Analytics</div>
    <div class="nav-item ${on('gallery')}" onclick="goCurrentTripSection('gallery')"><span class="ic">🖼️</span>Gallery</div>
    <div class="nav-item ${on('summary')}" onclick="goCurrentTripSection('summary')"><span class="ic">📄</span>Summary</div>
  </div>`;
}
function navSection(parts){
  if(parts[0]==='home'||parts.length===0) return 'home';
  if(parts[0]==='trips') return 'trips';
  if(parts[0]==='trip') return parts[2];
  return '';
}
function goCurrentTripSection(section){
  const trips = Storage.getTrips();

  if(!active){ showToast('Create a trip first'); navigate('/create-trip'); return; }
  navigate(`/trip/${active.id}/${section}`);
}

function viewExpenseForm(tripId, dayId, category, expenseId){

  return `

          </div>

              <div class="pill ${payment==='upi'?'active':''}" data-val="upi" onclick="selectPayment(this)">GPay/UPI</div>
              <div class="pill ${payment==='split'?'active':''}" data-val="split" onclick="selectPayment(this)">Split Payment</div>
            </div>
          </div>
          <div id="splitWrap" style="display:${payment==='split'?'block':'none'}">
            <div class="split-row">
              <div class="field"><label>Cash Amount</label><input type="number" id="f_cashAmount" inputmode="decimal" value="${existing?.cashAmount||''}" oninput="updateSplitTotal()"></div>
              <div class="field"><label>UPI Amount</label><input type="number" id="f_upiAmount" inputmode="decimal" value="${existing?.upiAmount||''}" oninput="updateSplitTotal()"></div>
            </div>
            <div class="text-sub" id="splitTotalLbl">Total: ₹0</div>
          </div>

          <div class="field">
            <label>${cfg.photo.label}</label>
            <label class="file-drop">
              📎 Tap to ${cfg.photo.multi?'add photos':'upload'}
              <input type="file" accept="image/*" ${cfg.photo.multi?'multiple':''} onchange="handlePhotoUpload(event)">
            </label>
            <div class="file-preview" id="photoPreview"></div>
          </div>

          <div class="field">
            <label>Notes</label>
            <textarea id="f_notes" placeholder="Optional notes...">${existing?.notes||''}</textarea>
          </div>

          <button type="button" class="btn btn-primary" onclick="saveExpense('${tripId}','${dayId}','${category}','${expenseId||''}')">
            ${existing ? 'Update' : 'Save'} Expense
          </button>
        </form>
      </div>
    </div>
  `;
}
function renderField(f, existing){
  const val = existing ? (existing[f.id] ?? '') : '';
  if(f.type==='select'){
    return `<div class="field"><label>${f.label}</label>
      <select id="f_${f.id}">
        <option value="">Select...</option>
        ${f.options.map(o=>`<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join('')}
      </select></div>`;
  }
  if(f.type==='rating'){
    const stars = Number(val)||0;
    return `<div class="field"><label>${f.label}</label>
      <div class="stars" id="f_${f.id}" data-val="${stars}">
        ${[1,2,3,4,5].map(i=>`<span class="${i<=stars?'on':''}" onclick="setRating('${f.id}',${i})">★</span>`).join('')}
      </div></div>`;
  }
  if(f.type==='textarea'){
    return `<div class="field"><label>${f.label}</label><textarea id="f_${f.id}">${val}</textarea></div>`;
  }
  if(f.type==='date'){
    const display = val ? formatDateDisplay(val) : '';
    return `<div class="field"><label>${f.label}${f.required?' *':''}</label>
      <div class="date-display" id="f_${f.id}_display" onclick="openCalendarPicker('${f.id}')">
        📅 <span id="f_${f.id}_label" class="${display?'':'ph'}">${display || 'Select date'}</span>
      </div>
      <input type="hidden" id="f_${f.id}" value="${escapeAttr(val)}">
    </div>`;
  }
  if(f.type==='time'){
    return `<div class="field"><label>${f.label}${f.required?' *':''}</label><input type="time" id="f_${f.id}" value="${escapeAttr(val)}"></div>`;
  }
  return `<div class="field"><label>${f.label}${f.required?' *':''}</label><input type="text" id="f_${f.id}" value="${escapeAttr(val)}" placeholder="${f.label}"></div>`;
}
function setRating(fieldId, val){
  const wrap = document.getElementById('f_'+fieldId);
  wrap.dataset.val = val;
  [...wrap.children].forEach((s,i)=> s.classList.toggle('on', i < val));
}
function selectPayment(el){
  document.querySelectorAll('#paymentPills .pill').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('splitWrap').style.display = el.dataset.val==='split' ? 'block' : 'none';
  if(el.dataset.val==='split') updateSplitTotal();
}
function updateSplitTotal(){
  const c = Number(document.getElementById('f_cashAmount').value)||0;
  const u = Number(document.getElementById('f_upiAmount').value)||0;
  document.getElementById('splitTotalLbl').textContent = `Total: ${fmtMoney(c+u)}`;
  document.getElementById('f_amount').value = c+u;
}
function handlePhotoUpload(evt){
  const files = [...evt.target.files];
  const multi = PENDING_PHOTOS.length>0 || files.length>1;
  Promise.all(files.map(f => new Promise(res=>{
    const reader = new FileReader();
    reader.onload = () => res(reader.result);
    reader.readAsDataURL(f);
  }))).then(results=>{
    if(multi){ PENDING_PHOTOS = PENDING_PHOTOS.concat(results); }
    else { PENDING_PHOTOS = results; }
    renderPhotoPreview();
  });
}
function renderPhotoPreview(){
  document.getElementById('photoPreview').innerHTML =
    PENDING_PHOTOS.map((src,i)=>`<img src="${src}" onclick="removePhoto(${i})">`).join('');
}
function removePhoto(i){ PENDING_PHOTOS.splice(i,1); renderPhotoPreview(); }

function saveExpense(tripId, dayId, category, expenseId){
  const trip = Storage.getTrip(tripId);
  const day = trip.days.find(d=>d.id===dayId);
  const cfg = CATEGORIES[category];

  const paymentEl = document.querySelector('#paymentPills .pill.active');
  const payment = paymentEl ? paymentEl.dataset.val : 'cash';
  let amount = Number(document.getElementById('f_amount').value)||0;
  let cashAmount=0, upiAmount=0;
  if(payment==='split'){
    cashAmount = Number(document.getElementById('f_cashAmount').value)||0;
    upiAmount = Number(document.getElementById('f_upiAmount').value)||0;
    amount = cashAmount + upiAmount;
  }

  const data = { category, amount, payment, cashAmount, upiAmount,
    notes:document.getElementById('f_notes').value, photos:PENDING_PHOTOS };
  cfg.fields.forEach(f=>{
    if(f.type==='rating'){ data[f.id] = Number(document.getElementById('f_'+f.id).dataset.val)||0; }
    else { data[f.id] = document.getElementById('f_'+f.id).value; }
    if(f.required && !data[f.id]){ showToast(`${f.label} is required`); throw new Error('validation'); }
  });

  try{
    if(expenseId){
      const idx = day.expenses.findIndex(e=>e.id===expenseId);
      day.expenses[idx] = {...day.expenses[idx], ...data};
    } else {
      day.expenses.push({id:uid(), createdAt:Date.now(), ...data});
    }
  }catch(e){ return; }

  Storage.upsertTrip(trip);
  showToast('Expense saved');
  navigate(`/trip/${tripId}/day/${dayId}`);
}
function deleteExpense(tripId, dayId, expenseId){
  const trip = Storage.getTrip(tripId);
  const day = trip.days.find(d=>d.id===dayId);
  day.expenses = day.expenses.filter(e=>e.id!==expenseId);
  Storage.upsertTrip(trip);
  showToast('Expense deleted');
  navigate(`/trip/${tripId}/day/${dayId}`);
}

   VIEW: ANALYTICS  (lightweight canvas charts — no external libs,

function viewAnalytics(tripId){

    <div class="topbar">

      <div class="card mb-16">

/* ==================================================================
   VIEW: GALLERY
   ================================================================== */
function viewGallery(tripId){
  const trip = Storage.getTrip(tripId);

      ${photos.length ? `

          <div class="ic">🖼️</div><h3>No memories yet</h3>

  const trip = Storage.getTrip(tripId);
  if(!trip) return notFoundView();
  const total = tripTotal(trip);
  const cash = tripCashTotal(trip);
  const upi = tripUpiTotal(trip);
  const cats = categoryTotals(trip);
  const topCat = Object.entries(cats).sort((a,b)=>b[1]-a[1])[0];
  const photoCount = allExpenses(trip).reduce((s,e)=>s+(e.photos?e.photos.length:0),0);

  return `
    <div class="topbar">
      <div class="back-btn" onclick="navigate('/trip/${trip.id}/dashboard')">←</div>
      <h2>Trip Summary</h2>
      <div class="icon-btn" onclick="exportSummary('${tripId}')">⬇️</div>
    </div>
    <div class="page-pad">
      <div class="boarding-pass mb-16">
        <div class="eyebrow">Summary Report</div>
        <h2>${escapeHTML(trip.name)}</h2>
        <div class="perforation"><div class="hole left"></div><div class="dashes"></div><div class="hole right"></div></div>
        <div class="split-stats">
          <div class="s"><div class="n">${trip.days.length}</div><div class="l">Days</div></div>
          <div class="s"><div class="n">${fmtMoney(total)}</div><div class="l">Total Spent</div></div>
          <div class="s"><div class="n">${photoCount}</div><div class="l">Photos</div></div>
        </div>
      </div>

      <div class="card mb-16">
        <div class="legend-row"><span>💵</span><span>Cash Spent</span><span class="amt">${fmtMoney(cash)}</span></div>
        <div class="legend-row"><span>📱</span><span>UPI Spent</span><span class="amt">${fmtMoney(upi)}</span></div>
        <div class="legend-row"><span>🏆</span><span>Top Category</span><span class="amt">${topCat && topCat[1]>0 ? CATEGORIES[topCat[0]].label : '—'}</span></div>
      </div>

      <div class="section-title">Day-wise summary</div>
      ${trip.days.map(d => dayCardHTML(trip,d)).join('')}

      <div class="section-title">Expense breakdown</div>
      <div class="card">
        ${CATEGORY_KEYS.filter(k=>cats[k]>0).map(k=>`
          <div class="legend-row">
            <span class="dot" style="background:${'#2563EB'}"></span>
            <span>${CATEGORIES[k].icon} ${CATEGORIES[k].label}</span>
            <span class="amt">${fmtMoney(cats[k])}</span>
          </div>`).join('') || '<p class="text-sub">No expenses logged yet.</p>'}
        <div class="total-row"><span>Total</span><span>${fmtMoney(total)}</span></div>

    </div>
  `;
}
function exportSummary(tripId){
  const trip = Storage.getTrip(tripId);
  // Frontend-only export: downloads a JSON snapshot of the trip.
  const blob = new Blob([JSON.stringify(trip,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${trip.name.replace(/\s+/g,'_')}_summary.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('Exported!');
}

}

/* ==================================================================
   CALENDAR DATE PICKER
   ================================================================== */
let CAL_STATE = {};
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function openCalendarPicker(fieldId){
  const input = document.getElementById('f_'+fieldId);
  const current = input.value ? new Date(input.value+'T00:00:00') : new Date();
  CAL_STATE = { fieldId, year: current.getFullYear(), month: current.getMonth(), selected: input.value || '' };
  openModal(calendarPickerHTML());
  attachCalendarSwipe();
}
function calendarPickerHTML(){
  const {year, month, selected} = CAL_STATE;
  const today = new Date();
  const todayIso = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  let cells = '';
  for(let i=0;i<firstDay;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const cls = ['cal-cell'];
    if(iso===selected) cls.push('sel');
    else if(iso===todayIso) cls.push('today');
    cells += `<div class="${cls.join(' ')}" onclick="pickCalendarDate(${year},${month},${d})">${d}</div>`;
  }
  return `
    <div class="cal-picker">
      <div class="cal-swipe" id="calSwipe">
        <div class="cal-header">
          <h3>${MONTH_NAMES[month]} ${year}</h3>
        </div>
        <div class="cal-hint">‹ swipe to change month ›</div>
        <div class="cal-weekdays">
          <div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div>
        </div>
        <div class="cal-grid">${cells}</div>
      </div>
      <button class="btn btn-outline mt-16" onclick="closeModal()">Cancel</button>
    </div>
  `;
}
function calNavMonth(delta){
  CAL_STATE.month += delta;
  if(CAL_STATE.month<0){ CAL_STATE.month=11; CAL_STATE.year--; }
  if(CAL_STATE.month>11){ CAL_STATE.month=0; CAL_STATE.year++; }
  document.querySelector('.modal-sheet').innerHTML = calendarPickerHTML();
  attachCalendarSwipe();
}
function attachCalendarSwipe(){
  const el = document.getElementById('calSwipe');
  if(!el) return;
  let startX=0, startY=0, dragging=false;

  const onDown = (e)=>{
    const pt = e.touches ? e.touches[0] : e;
    startX = pt.clientX; startY = pt.clientY;
    dragging = true;
    if(e.pointerId!=null && el.setPointerCapture){ try{ el.setPointerCapture(e.pointerId); }catch(err){} }
  };
  const onMove = (e)=>{
    if(!dragging) return;
    const pt = e.touches ? e.touches[0] : e;
    const dx = pt.clientX - startX, dy = pt.clientY - startY;
    if(Math.abs(dx) > Math.abs(dy) && e.cancelable) e.preventDefault();
  };
  const onUp = (e)=>{
    if(!dragging) return;
    dragging = false;
    const pt = e.changedTouches ? e.changedTouches[0] : e;
    const dx = pt.clientX - startX, dy = pt.clientY - startY;
    if(Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)){
      el.classList.add(dx < 0 ? 'swipe-left' : 'swipe-right');
      calNavMonth(dx < 0 ? 1 : -1);
    }
  };

  if(window.PointerEvent){
    el.onpointerdown = onDown;
    el.onpointermove = onMove;
    el.onpointerup = onUp;
    el.onpointercancel = ()=>{ dragging = false; };
  } else {
    el.ontouchstart = onDown;
    el.ontouchmove = onMove;
    el.ontouchend = onUp;
    el.onmousedown = onDown;
    el.onmousemove = onMove;
    el.onmouseup = onUp;
    el.onmouseleave = ()=>{ dragging = false; };
  }
}
function pickCalendarDate(year, month, day){
  const iso = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  const fieldId = CAL_STATE.fieldId;
  document.getElementById('f_'+fieldId).value = iso;
  const lbl = document.getElementById('f_'+fieldId+'_label');
  lbl.textContent = formatDateDisplay(iso);
  lbl.classList.remove('ph');
  closeModal();
}
function formatDateDisplay(iso){
  const [y,m,d] = iso.split('-').map(Number);
  const shortMonths = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${d} ${shortMonths[m-1]} ${y}`;
}

function notFoundView(){
  return `<div class="page-pad"><div class="empty-state"><div class="ic">🧭</div><h3>Not found</h3><p>That page or trip doesn't exist.</p><button class="btn btn-primary" onclick="navigate('/home')">Go Home</button></div></div>`;
}
function escapeHTML(str){ return (str||'').toString().replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function escapeAttr(str){ return escapeHTML(str); }

/* ==================================================================
   POST-RENDER: draw canvas charts when analytics view is active
   ================================================================== */
function afterRender(parts){
  if(parts[0]==='trip' && parts[2]==='analytics'){
    const trip = Storage.getTrip(parts[1]);
    if(trip) drawAnalyticsCharts(trip);
  }
}
function drawAnalyticsCharts(trip){
  const cats = categoryTotals(trip);
  const total = tripTotal(trip);
  const colors = ['#2563EB','#14B8A6','#F59E0B','#8B5CF6','#EC4899','#22C55E','#F97316','#64748B'];
  const entries = CATEGORY_KEYS.map((k,i)=>({key:k,label:CATEGORIES[k].label,val:cats[k]||0,color:colors[i]})).filter(e=>e.val>0);

  // Pie chart
  const pie = document.getElementById('pieCanvas');
  if(pie){
    const ctx = pie.getContext('2d');
    ctx.clearRect(0,0,pie.width,pie.height);
    const cx = pie.width/2, cy = pie.height/2, r = Math.min(cx,cy)-10;
    let start = -Math.PI/2;
    if(entries.length===0){
      ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--border').trim() || '#e2e8f0';
      ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
    } else {
      entries.forEach(e=>{
        const angle = (e.val/total)*Math.PI*2;
        ctx.beginPath(); ctx.moveTo(cx,cy);
        ctx.arc(cx,cy,r,start,start+angle);
        ctx.closePath(); ctx.fillStyle = e.color; ctx.fill();
        start += angle;
      });
    }
    document.getElementById('pieLegend').innerHTML = entries.map(e=>`
      <div class="legend-row"><span class="dot" style="background:${e.color}"></span>${e.label}<span class="amt">${fmtMoney(e.val)}</span></div>
    `).join('') || '<p class="text-sub">No data yet.</p>';
  }

  // Bar chart: daily expenses
  const bar = document.getElementById('barCanvas');
  if(bar){
    const ctx = bar.getContext('2d');
    ctx.clearRect(0,0,bar.width,bar.height);
    const days = trip.days;
    const totals = days.map(d=>dayTotal(d));
    const max = Math.max(1,...totals);
    const padding = 24, w = bar.width, h = bar.height;
    const barW = Math.min(40, (w-padding*2)/days.length - 10);
    days.forEach((d,i)=>{
      const x = padding + i*((w-padding*2)/days.length) + 5;
      const bh = (totals[i]/max)*(h-40);
      ctx.fillStyle = '#2563EB';
      ctx.fillRect(x, h-24-bh, barW, bh);
      ctx.fillStyle = '#64748B';
      ctx.font = '10px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('D'+d.dayNumber, x+barW/2, h-10);
    });
  }
}
